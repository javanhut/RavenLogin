# ImLazy configuration for RavenLogin.

[commands]

# The VCS checkout doesn't preserve the executable bit on scripts/, so the
# tasks that run a script fail with "Permission denied". They all depend on
# this. No elevation needed: the files belong to the user.
[commands.permission]
desc = "Make the scripts in scripts/ executable"
run = ["chmod +x scripts/*.sh"]

[commands.build]
desc = "Build everything, release"
run = ["cargo build --release"]

[commands.test]
desc = "Run the whole test suite"
run = ["cargo test --workspace"]

[commands.check]
desc = "Everything CI runs: format, lints, unsafe quarantine, tests"
dep = ["permission"]
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
    "./scripts/check-unsafe.sh",
    "cargo test --workspace",
]

[commands.unsafe]
desc = "Assert unsafe is confined to raven-privdrop"
dep = ["permission"]
run = ["./scripts/check-unsafe.sh"]
alias = ["check-unsafe"]

[commands.preview]
# imlazy has no variables, so the default comes from the shell: override it
# with `state=denied imlazy preview`. One of empty, typing, denied, caps,
# busy, throttled, unlocking, arriving. Add `--lock` or `--at MS` by running
# the cargo command by hand; see README "Seeing it without booting".
desc = "Render the login screen to /tmp/raven-login.png without booting"
run = [
    "cargo run -q -p raven-greeter -- --preview /tmp/raven-login.png 1920x1080 ${state:-empty}",
]

[commands.install]
desc = "Build release, install, and wire into raven-init"
dep = ["permission", "build"]
escalate = true
run = ["./scripts/install.sh"]

# Spelled out because it must exist. Without it, imlazy fuzzy-matches
# `uninstall` to `install` and cheerfully installs what you asked it to remove.
[commands.uninstall]
desc = "Unwire from raven-init and remove the binaries"
dep = ["permission"]
escalate = true
run = ["./scripts/uninstall.sh"]

[commands.purge]
desc = "Uninstall, and also remove login.toml and the raven-greeter account"
dep = ["permission"]
escalate = true
run = ["./scripts/uninstall.sh --purge"]
